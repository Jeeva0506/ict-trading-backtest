# ============================================================================
# INDEX SPECIFICATIONS - Market Details from MT4/MT5
# ============================================================================
# Risk tiers based on filter quality:
#   - High Quality (CVD + OB2 VWAP + Sweep): 1.0%
#   - Medium Quality (CVD + OB2 VWAP): 0.5%
#   - Base Quality (OB2 VWAP only): 0.25%
# ============================================================================

risk_tiers:
  high_quality:    # CVD + OB2 VWAP + Liquidity Sweep
    risk_percent: 0.01
    filters: [cvd, ob2_vwap, liquidity_sweep]
  medium_quality:  # CVD + OB2 VWAP
    risk_percent: 0.005
    filters: [cvd, ob2_vwap]
  base_quality:    # OB2 VWAP alone
    risk_percent: 0.0025
    filters: [ob2_vwap]

