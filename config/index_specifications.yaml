    min_trading_days: 4
    
  phase_2:
    profit_target_percent: 5
    max_daily_loss_percent: 5
    max_total_drawdown_percent: 10
    min_trading_days: 4
    
  funded:
    profit_split_percent: 80
    max_daily_loss_percent: 5
    max_total_drawdown_percent: 10
