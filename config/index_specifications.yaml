# ============================================================================
# FILTER COMBINATIONS FOR TESTING
# ============================================================================

filter_combinations:
  - name: "All Filters (High Quality)"
    id: "all_filters"
    use_cvd_filter: true
    use_liquidity_sweep_filter: true
    use_ob2_vwap_filter: true
    risk_tier: "high_quality"
    
  - name: "CVD + OB2 VWAP (Medium Quality)"
    id: "cvd_ob2vwap"
    use_cvd_filter: true
    use_liquidity_sweep_filter: false
    use_ob2_vwap_filter: true
    risk_tier: "medium_quality"
    
  - name: "CVD + Sweep"
    id: "cvd_sweep"
    use_cvd_filter: true
    use_liquidity_sweep_filter: true
    use_ob2_vwap_filter: false
    risk_tier: "medium_quality"
    
  - name: "Sweep + OB2 VWAP"
    id: "sweep_ob2vwap"
    use_cvd_filter: false
    use_liquidity_sweep_filter: true
    use_ob2_vwap_filter: true
    risk_tier: "medium_quality"
    
  - name: "CVD Only"
    id: "cvd_only"
    use_cvd_filter: true
    use_liquidity_sweep_filter: false
    use_ob2_vwap_filter: false
    risk_tier: "base_quality"
    
  - name: "OB2 VWAP Only (Base Quality)"
    id: "ob2vwap_only"
    use_cvd_filter: false
    use_liquidity_sweep_filter: false
    use_ob2_vwap_filter: true
    risk_tier: "base_quality"
    
  - name: "Sweep Only"
    id: "sweep_only"
    use_cvd_filter: false
    use_liquidity_sweep_filter: true
    use_ob2_vwap_filter: false
    risk_tier: "base_quality"
    
  - name: "No Filters (Core Strategy)"
    id: "no_filters"
    use_cvd_filter: false
    use_liquidity_sweep_filter: false
    use_ob2_vwap_filter: false
    risk_tier: "base_quality"

# ============================================================================
# PROP FIRM CHALLENGE TARGETS
